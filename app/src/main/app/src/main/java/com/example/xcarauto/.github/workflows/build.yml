name: Build XCarAuto APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download Android Auto SDK automatically
        run: |
          mkdir -p app/libs
          curl -L "https://github.com/martoreto/aauto-sdk/raw/master/aasdk/libs/android-auto-sdk.aar" -o app/libs/android-auto-sdk.aar

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XCarAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
